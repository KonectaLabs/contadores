<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#153f37" />
    <title>Website Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%23153f37'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='56' font-family='Arial' font-weight='700' fill='white'%3EW%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <header class="brand">
          <div class="brand-mark">W</div>
          <div>
            <strong>Website Agent</strong>
            <span>WhatsApp simulator</span>
          </div>
          <button class="icon-button" id="new-user" aria-label="Nueva conversación">+</button>
        </header>
        <div class="conversation-label">Conversaciones</div>
        <div class="users" id="users"></div>
      </aside>

      <section class="chat">
        <div class="empty-state" id="empty-state">
          <div class="empty-mark">W</div>
          <h1>Elegí una conversación</h1>
          <p>Creá un usuario y empezá a diseñar su sitio por chat.</p>
          <button class="primary-button" id="empty-new-user">Nueva conversación</button>
        </div>

        <div class="conversation hidden" id="conversation">
          <header class="chat-header">
            <div class="avatar" id="avatar"></div>
            <div>
              <strong id="chat-name"></strong>
              <span id="chat-status">en línea</span>
            </div>
          </header>

          <div class="messages" id="messages"></div>

          <form class="composer" id="composer">
            <div class="selected-files" id="selected-files"></div>
            <div class="composer-row">
              <label class="icon-button attach-button" for="files" aria-label="Adjuntar archivos">＋</label>
              <input id="files" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt" />
              <textarea id="message" rows="1" placeholder="Escribí un mensaje" aria-label="Mensaje"></textarea>
              <button class="send-button" type="submit" aria-label="Enviar mensaje">➤</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <dialog id="user-dialog">
      <form method="dialog" id="user-form">
        <div class="dialog-heading">
          <div>
            <span>Nueva conversación</span>
            <h2>Simular usuario</h2>
          </div>
          <button class="icon-button" id="close-dialog" type="button" aria-label="Cerrar">×</button>
        </div>
        <label>Nombre<input name="name" required autocomplete="off" placeholder="María González" /></label>
        <label>WhatsApp<input name="phone" required autocomplete="off" placeholder="+54 9 11 2345 6789" /></label>
        <button class="primary-button" type="submit">Crear conversación</button>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
