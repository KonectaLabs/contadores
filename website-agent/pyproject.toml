[project]
name = "website-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepagents[video]==0.7.1",
    "fastapi[standard]>=0.124.4",
    "httpx>=0.28.1",
    "langchain-openai==1.4.1",
    "langgraph-sdk==0.4.2",
    "pywa==3.8.0",
    "sqlmodel>=0.0.27",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
