name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend tests
        env:
          AUTH_DISABLE: "true"
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --group dev pytest -p no:cacheprovider src/backend/tests -q

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bot tests
        env:
          PYTHONPATH: src:src/bot
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --project src/bot --group dev pytest -p no:cacheprovider src/bot/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
