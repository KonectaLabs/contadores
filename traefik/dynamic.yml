http:
  routers:
    didactiqo-education:
      rule: "Host(`didactiqo.fgoiriz.com`) || Host(`didactiqo.com`)"
      priority: 100
      entryPoints:
        - web
      service: didactiqo-education
    codex-approval:
      rule: "Host(`codex-approval.fgoiriz.com`)"
      priority: 100
      entryPoints:
        - web
      service: codex-approval
    codex-approval-secure:
      rule: "Host(`codex-approval.fgoiriz.com`)"
      priority: 100
      entryPoints:
        - websecure
      tls: {}
      service: codex-approval
    backend:
      rule: "Host(`crm.fgoiriz.com`) && PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - web
      service: backend
    backend-secure:
      rule: "Host(`crm.fgoiriz.com`) && PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - websecure
      tls: {}
      service: backend
    bot:
      rule: "Host(`crm.fgoiriz.com`) && PathPrefix(`/webhook`)"
      priority: 10
      entryPoints:
        - web
      service: bot
    bot-secure:
      rule: "Host(`crm.fgoiriz.com`) && PathPrefix(`/webhook`)"
      priority: 10
      entryPoints:
        - websecure
      tls: {}
      service: bot
  services:
    didactiqo-education:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3417"
    codex-approval:
      loadBalancer:
        servers:
          - url: "http://codex-approval:8765"
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8000"
    bot:
      loadBalancer:
        servers:
          - url: "http://bot:8100"
